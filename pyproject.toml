[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptLattes"
version = "0.7.0"
description = "System for extraction and analysis of Lattes curricula"
readme = "README.md"
authors = [
  { name = "Jesus P. Mena-Chalco", email = "jesus.mena@ufabc.edu.br" },
  { name = "Roberto M. Cesar-Jr." },
]
license = { text = "GNU GPL v2" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Operating System :: OS Independent",
]
dependencies = [
  "beautifulsoup4>=4.13.5",
  "networkx>=3.5",
  "rapidfuzz>=3.14.0",
  "scipy>=1.16.1",
  "playwright>=1.40.0",
  "tqdm>=4.67.1",
]
requires-python = ">=3.8"

[project.urls]
"Homepage" = "https://github.com/jpmenachalco/scriptLattes"

[project.scripts]
scriptLattes = "scriptLattes.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scriptLattes*"]
namespaces = false
